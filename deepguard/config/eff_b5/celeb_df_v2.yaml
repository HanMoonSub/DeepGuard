dataset: "Celeb_DF(V2)"

model:
      model_name: "tf_efficientnet_b5.ns_jft_in1k"
      img_size: [384,384]

      # ===== Feature Extraction Blocks =====
      l_block_idx: 1 # Low-level feature stage index (unused, use_low=False)
      h_block_idx: 6 # High-level feature stage index

      # ===== Ablation: EfficientNet-only baseline (no GCViT branch) =====
      use_low: False
      use_high: False

train:
      epochs: 10
      use_amp: True # Mixed Precision Training
      n_accumulate: 1 # Gradient Accumulation steps
      optimizer: "AdamW"
      loss: "BCEWithLogitsLoss"
      scheduler: "CosineAnnealingLR"

      # Albumentation
      mixup_alpha: 0.4
      mixup_prob: 0.25
      cutout_prob: 0.5

      # DataLoader
      train_bs: 16
      valid_bs: 32

      # Learning Rate
      backbone_lr: 5e-4
      h_block_lr: 2e-4
      l_block_lr: 1e-4
      head_lr: 1e-3

      # Weight Decay
      backbone_wd: 1e-3
      h_block_wd: 5e-4
      l_block_wd: 1e-3
      head_wd: 1e-5

      # Early Stopping
      patience: 3
      min_delta: 0.001
