dataset: "Celeb_DF(V2)"

# CORE-specific settings (aug, consistency rate, 2-class CE, lr) follow the original repo (niyunsheng/CORE)
model:
      num_classes: 2 # 2-class head + CrossEntropy, as in the original
      img_size: [299,299]

train:
      epochs: 10
      use_amp: True # Mixed Precision Training
      n_accumulate: 1 # Gradient Accumulation steps
      optimizer: "AdamW"
      scheduler: "CosineAnnealingLR"

      # CORE
      # original CelebDF command: --aug-name RE --consistency-rate 1.0
      aug_name: "RE"
      consistency_rate: 1.0
      real_weight: 1.0 # CE weight for REAL (original 4.0); 1.0 since 1:1 class balancing is used

      # DataLoader
      train_bs: 32 # per view -> 64 images per forward
      valid_bs: 32

      # Learning Rate
      backbone_lr: 2e-4
      head_lr: 2e-4

      # Weight Decay
      backbone_wd: 5e-4
      head_wd: 5e-4

      # Early Stopping
      patience: 3
      min_delta: 0.001
