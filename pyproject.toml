[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
# ─────────────────────────────────────────────
# [project]
# Package metadata uploaded to PyPI
# Information shown after pip install deepguard
# ─────────────────────────────────────────────
[project]
name = "deepguard"           # pip install deepguard 할 때 이 이름
version = "2.0.1"            
description = "Multi-Scale Efficient Global Context Vision Transformer for Robust Deepfake Detection"
readme = "README.md"         # description shown on the PyPI page (markdown)
requires-python = ">=3.10"   # torch/torchvision/torchmetrics require Python >= 3.10, so this follows that lower bound
license = { text = "MIT" }
authors = [
    { name = "seoyunje", email = "seoyunje2001@gmail.com" },
    { name = "한문섭", email = "hanmoon3054@gmail.com" },
    { name = "이예솔", email = "yesol4138@chungbuk.ac.kr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "torchmetrics>=1.6.1",
    "timm>=1.0.12",
    "ultralytics>=8.4.41",
    "grad-cam>=1.5.5",
    "albumentations>=2.0.8",
    "opencv-python>=5.0.0.93",
    "numpy>=1.23.0,<3.0.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.10.0",
    "tqdm>=4.60.0",
    "colorama>=0.4.6",
]
# ─────────────────────────────────────────────
# [project.optional-dependencies]
# Optional install: pip install deepguard[deepclip]
# ─────────────────────────────────────────────
[project.optional-dependencies]
deepclip = ["deepclip>=1.0.0"]   # ClipImagePredictor, ClipVideoPredictor (deepclip_b0, deepclip_b5)
[project.urls]
Homepage = "https://github.com/HanMoonSub/DeepGuard"
"Bug Tracker" = "https://github.com/HanMoonSub/DeepGuard/issues"
"Source Code" = "https://github.com/HanMoonSub/DeepGuard"
"Hugging Face" = "https://huggingface.co/KoreaPeter"
"Demo - DeepFake Image" = "https://huggingface.co/spaces/KoreaPeter/DeepFake-Image-Detection"
"Demo - DeepFake Video" = "https://huggingface.co/spaces/KoreaPeter/DeepFake-Video-Detection"
"Demo - DeepFake XAI" = "https://huggingface.co/spaces/KoreaPeter/DeepFake-Detection-XAI"
[tool.setuptools.packages.find]
include = [
    "deepguard*",       # core packages: models, layers, datasets, etc.
    "inference*",       # ImagePredictor, VideoPredictor
    "explainability*",  # CAM-based XAI
    "preprocess*"       # face detection, frame extraction, etc.
]
exclude = ["App*", "client*"]