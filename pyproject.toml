[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
# ─────────────────────────────────────────────
# [project]
# PyPI에 올라가는 패키지 메타데이터
# pip install deepguard 했을 때 보이는 정보들
# ─────────────────────────────────────────────
[project]
name = "deepguard"           # pip install deepguard 할 때 이 이름
version = "1.0.0"            
description = "Multi-Scale Efficient Global Context Vision Transformer for Robust Deepfake Detection"
readme = "README.md"         # PyPI 페이지에 표시될 설명 (마크다운)
requires-python = ">=3.10"   # torch/torchvision/torchmetrics의 Requires-Python 하한이 3.10이라 이 값을 그대로 따름
license = { text = "MIT" }
authors = [
    { name = "seoyunje", email = "seoyunje2001@gmail.com" },
    { name = "한문섭", email = "hanmoon3054@gmail.com" },
    { name = "이예솔", email = "yesol4138@chungbuk.ac.kr" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "torchmetrics>=1.6.1",
    "timm>=1.0.12",
    "ultralytics>=8.4.41",
    "grad-cam>=1.5.5",
    "albumentations>=2.0.8",
    "opencv-python>=5.0.0.93",
    "numpy>=1.23.0,<3.0.0",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.10.0",
    "matplotlib>=3.10.9",
    "tqdm>=4.60.0",
    "colorama>=0.4.6",
]
[project.urls]
Homepage = "https://github.com/HanMoonSub/DeepGuard"
"Bug Tracker" = "https://github.com/HanMoonSub/DeepGuard/issues"
"Source Code" = "https://github.com/HanMoonSub/DeepGuard"
"Hugging Face" = "https://huggingface.co/KoreaPeter"
"Demo - DeepFake Image" = "https://huggingface.co/spaces/KoreaPeter/DeepFake-Image-Detection"
"Demo - DeepFake Video" = "https://huggingface.co/spaces/KoreaPeter/DeepFake-Video-Detection"
"Demo - DeepFake XAI" = "https://huggingface.co/spaces/KoreaPeter/DeepFake-Detection-XAI"
[tool.setuptools.packages.find]
include = [
    "deepguard*",       # 모델, 레이어, 데이터셋 등 핵심 패키지
    "inference*",       # ImagePredictor, VideoPredictor
    "explainability*",  # CAM 기반 XAI
    "preprocess*"       # 얼굴 검출, 프레임 추출 등
]
exclude = ["App*", "client*"]

[tool.setuptools.package-data]
"preprocess" = ["*.pt"]