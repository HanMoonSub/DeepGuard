x-db-credentials:
  user: &db_user ${DB_USER:-deepguard}
  password: &db_password ${DB_PASSWORD:-deepguard1234}
  name: &db_name ${DB_NAME:-deepguard_db}

x-app-env: &app-env
  DB_USER: *db_user
  DB_PASSWORD: *db_password
  DB_NAME: *db_name
  DB_PORT: 3306
  DB_HOST: deepguard-mysql
  UPLOAD_DIR: ./static/uploads
  EXPLAIN_UPLOAD_DIR: ./static/explain
  REDIS_HOST: deepguard-redis
  REDIS_PORT: 6379
  HF_TOKEN: ${HF_TOKEN}

services:
  mysql:
    image: seoyunje/deepguard-mysql:1.0.1
    container_name: deepguard-mysql
    networks: [deepguard-network]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: *db_name
      MYSQL_USER: *db_user
      MYSQL_PASSWORD: *db_password
    volumes:
      - deepguard-data:/var/lib/mysql

  redis:
    image: seoyunje/deepguard-redis:1.0.1
    container_name: deepguard-redis
    networks: [deepguard-network]
    volumes:
      - deepguard-memory:/data

  fastapi:
    image: seoyunje/deepguard-fastapi:1.0.1
    container_name: deepguard-fastapi
    networks: [deepguard-network]
    environment:
      <<: *app-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - deepguard-static:/app/App/static
    depends_on:
      - mysql
      - redis

  celery:
    image: seoyunje/deepguard-celery:1.0.1
    container_name: deepguard-celery
    networks: [deepguard-network]
    environment:
      <<: *app-env
      CELERY_CONCURRENCY: 2
    volumes:
      - deepguard-static:/app/App/static
    depends_on:
      - mysql
      - redis

  react:
    image: seoyunje/deepguard-react:1.0.1
    container_name: deepguard-react
    networks: [deepguard-network]
    ports:
      - "80:80"
    depends_on:
      - fastapi

networks:
  deepguard-network:
    name: deepguard-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1

volumes:
  deepguard-static:
    name: deepguard-static
  deepguard-memory:
    name: deepguard-memory
  deepguard-data:
    name: deepguard-data
