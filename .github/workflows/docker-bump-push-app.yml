name: Docker Bump & Push - FastAPI/Celery

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "requirements.txt"
      - "deepguard/**"
      - "inference/**"
      - "explainability/**"
      - "preprocess/**"
      - "pyproject.toml"
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  bump-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute new tag
        id: bump
        run: |
          set -euo pipefail
          current=$(grep -oP "seoyunje/deepguard-fastapi:\K[0-9]+\.[0-9]+\.[0-9]+" docker-compose.yml | head -1)
          IFS='.' read -r major minor patch <<< "$current"
          new_tag="${major}.${minor}.$((patch + 1))"
          echo "fastapi/celery: ${current} -> ${new_tag}"
          echo "new_tag=${new_tag}" >> "$GITHUB_OUTPUT"

      - name: Build & push fastapi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: App/Dockerfile
          target: fastapi
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/deepguard-fastapi:${{ steps.bump.outputs.new_tag }}
          push: true
          cache-from: type=gha,scope=fastapi
          cache-to: type=gha,mode=max,scope=fastapi

      - name: Build & push celery
        uses: docker/build-push-action@v7
        with:
          context: .
          file: App/Dockerfile
          target: celery
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/deepguard-celery:${{ steps.bump.outputs.new_tag }}
          push: true
          cache-from: type=gha,scope=celery
          cache-to: type=gha,mode=max,scope=celery
