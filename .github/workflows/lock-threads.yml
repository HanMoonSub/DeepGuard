name: Lock Threads

# Automatically lock long-closed issues/PRs to prevent unrelated new comments (necro-posting).

on:
  schedule:
    - cron: "0 1 * * *"  # Runs daily at 01:00 UTC (10:00 KST)
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v6.0.2
        with:
          process-only: "issues, prs"
          issue-inactive-days: "365"
          pr-inactive-days: "365"
          issue-comment: >
            이 이슈는 closed된 지 오래되어 자동으로 잠겼습니다.
            관련된 새 이슈가 있다면 새로 열어주세요.
          pr-comment: >
            이 PR은 closed된 지 오래되어 자동으로 잠겼습니다.
            관련된 새 PR이 있다면 새로 열어주세요.
          issue-lock-reason: "resolved"
          pr-lock-reason: "resolved"
