name: Publish to PyPI

# On a push of pyproject.toml to main: rewrite README image paths to absolute URLs -> build -> publish straight to PyPI.
# Setting an environment on the job makes GitHub create a Deployment automatically
# and keep its status (in_progress/success/failure) up to date.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepguard/
    permissions:
      id-token: write    # Required for PyPI Trusted Publishing (OIDC) - no API token needed
      deployments: write # Required to create/update GitHub Deployment status
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Rewrite relative image paths for PyPI
        run: sed -i -E 's#src="docs/#src="https://raw.githubusercontent.com/HanMoonSub/DeepGuard/main/docs/#g' README.md

      - name: Install build tool
        run: pip install build

      - name: Build sdist & wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
