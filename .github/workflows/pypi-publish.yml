name: Publish to PyPI

# main에 pyproject.toml이 push되면: README 이미지 경로를 절대 URL로 치환 -> 빌드 -> PyPI에 바로 배포.
# job에 environment를 지정하면 GitHub이 배포(Deployment)를 자동으로 생성하고
# 진행 상태(in_progress/success/failure)까지 갱신해준다.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deepguard/
    permissions:
      id-token: write    # PyPI Trusted Publishing(OIDC)에 필요 - API 토큰 불필요
      deployments: write # GitHub Deployment 생성/상태 업데이트에 필요
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Rewrite relative image paths for PyPI
        run: sed -i -E 's#src="docs/#src="https://raw.githubusercontent.com/HanMoonSub/DeepGuard/main/docs/#g' README.md

      - name: Install build tool
        run: pip install build

      - name: Build sdist & wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
