# Network
bind 0.0.0.0
port 6379
protected-mode no

# Persistence — AOF (session data / Celery task results survive restarts)
appendonly yes
appendfsync everysec
dir /data

# Persistence — RDB snapshots as a secondary safety net
save 900 1
save 300 10
save 60 10000

# Memory
maxmemory-policy noeviction
